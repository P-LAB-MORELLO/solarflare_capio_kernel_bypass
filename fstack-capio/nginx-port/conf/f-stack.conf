[dpdk]
# Core 3 only: the isolated core used by both arms of the raw sweep.
lcore_mask=8
channel=4
promiscuous=1
numa_on=0
tx_csum_offoad_skip=0
tso=0
lro=0
vlan_strip=1
idle_sleep=0
pkt_tx_delay=0
symmetric_rss=0
port_list=0
nb_vdev=0
nb_bond=0

[pcap]
enable=0
snaplen=96
savelen=16777216
savepath=.
timestamp_precision=0

[stack]
kernel_coexist=0

[port0]
addr=10.0.1.2
netmask=255.255.255.0
broadcast=10.0.1.255
gateway=10.0.1.1

[rss_check]
enable=0
